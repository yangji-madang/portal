<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN PORTAL</title>
<style>
  :root { --bg:#f4f6fa; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#d9dee7; --accent:#1d4ed8; --adm:#c2410c; --adm-bg:#fff1e6; --adm-line:#f0a36b; --adm-ink:#9a3412; --view:#1d4ed8; --view-bg:#e8f0ff; --view-line:#8fb0f5; --view-ink:#1e3a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:16px; line-height:1.5; }
  .wrap { max-width:760px; margin:0 auto; padding:20px 16px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  h1 { margin:0; font-size:26px; letter-spacing:1px; }
  .manage { font-size:13px; color:var(--sub); text-decoration:none; border:1px solid var(--line); padding:2px 6px; border-radius:6px; background:var(--card); line-height:1.3; }
  .manage:hover { color:var(--accent); border-color:var(--accent); }
  .cat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
  .cat h2 { margin:0 0 8px; font-size:17px; color:var(--accent); border-bottom:2px solid var(--accent); padding-bottom:5px; }
  .links { display:flex; flex-direction:column; gap:8px; }
  .line { display:flex; flex-wrap:wrap; gap:8px; }
  .links a { display:inline-block; padding:2px 6px; line-height:1.3; border:1px solid var(--line); border-radius:8px; color:var(--ink); text-decoration:none; font-weight:600; background:#f9fafc; }
  .links a.admin { background:var(--adm-bg); border-color:var(--adm-line); color:var(--adm-ink); }
  .links a.view { background:var(--view-bg); border-color:var(--view-line); color:var(--view-ink); }
  .links a.admin:hover { background:var(--adm); border-color:var(--adm); color:#fff; }
  .links a.view:hover { background:var(--view); border-color:var(--view); color:#fff; }
  .empty { color:var(--sub); font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ADMIN PORTAL</h1>
    <a class="manage" href="portal_admin.html">관리</a>
  </header>
  <main id="root"><p class="empty">불러오는 중...</p></main>
</div>
<script>
(function () {
  var root = document.getElementById('root');
  /* lines 형식이 있으면 그대로, 없으면 기존 links(+br) 형식을 줄로 변환 */
  function linesOf(c) {
    if (Array.isArray(c.lines)) return c.lines.map(function (ln) { return (ln && ln.links) || []; });
    var out = [], cur = null;
    (c.links || []).forEach(function (l) {
      if (!cur || l.br === true) { cur = []; out.push(cur); }
      cur.push(l);
    });
    return out;
  }
  function render(data) {
    root.innerHTML = '';
    var cats = (data && data.categories) || [];
    if (!cats.length) { root.innerHTML = '<p class="empty">등록된 항목이 없습니다.</p>'; return; }
    cats.forEach(function (c) {
      var box = document.createElement('section');
      box.className = 'cat';
      var h = document.createElement('h2');
      h.textContent = c.name;
      box.appendChild(h);
      var wrap = document.createElement('div');
      wrap.className = 'links';
      var lines = linesOf(c).filter(function (ln) { return ln.length; });
      if (!lines.length) {
        var e = document.createElement('span'); e.className = 'empty'; e.textContent = '링크 없음'; wrap.appendChild(e);
      } else {
        lines.forEach(function (ln) {
          var line = document.createElement('div');
          line.className = 'line';
          ln.forEach(function (l) {
            var a = document.createElement('a');
            a.className = l.type === 'admin' ? 'admin' : 'view'; a.href = l.url; a.textContent = l.name; a.target = '_blank'; a.rel = 'noopener';
            line.appendChild(a);
          });
          wrap.appendChild(line);
        });
      }
      box.appendChild(wrap);
      root.appendChild(box);
    });
  }
  var API = 'https://api.github.com/repos/yangji-madang/portal/contents/links.json?ref=main';
  function getJson(u, h) {
    return fetch(u, { headers: h || {}, cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }
  getJson(API, { 'Accept': 'application/vnd.github.raw+json' })
    .catch(function () { return getJson('links.json?t=' + Date.now()); })
    .then(render)
    .catch(function () { root.innerHTML = '<p class="empty">links.json을 불러오지 못했습니다.</p>'; });
})();
</script>
<script id="popup-drag">
/* popup-drag: 팝업(모달·dialog·플로팅 패널) 헤더 영역을 끌어 이동 (마우스·터치 공통) */
(function () {
  if (window.__popupDrag) return;
  window.__popupDrag = 1;
  var INTER = 'input,textarea,select,button,a,label,option,summary,[contenteditable],[role=button]';
  var SKIP = /toast|copy|drawer|menu|tooltip|banner|navbar|fmtpanel|pd-skip/i;
  var NAME = /pop|modal|dlg|dialog|panel|sheet|layer/i;
  var moved = [], drag = null, lastDrag = 0, lastMove = 0;

  var st = document.createElement('style');
  st.textContent =
    'html.pd-can *:not(input):not(textarea):not(select):not(button):not(a):not(label){cursor:move!important}' +
    'html.pd-drag,html.pd-drag *{cursor:move!important;user-select:none!important;-webkit-user-select:none!important}';
  (document.head || document.documentElement).appendChild(st);

  function alpha(c) {
    var m = /rgba?\(([^)]+)\)/.exec(c || '');
    if (!m) return 0;
    var p = m[1].split(',');
    return p.length > 3 ? parseFloat(p[3]) : 1;
  }
  function nm(el) { return (el.id || '') + ' ' + (el.getAttribute('class') || ''); }

  function findPanel(t) {
    if (!t || !t.closest) return null;
    var d = t.closest('dialog');
    if (d) return d.open && !SKIP.test(nm(d)) ? d : null;
    var prev = null, el = t, vw = innerWidth, vh = innerHeight;
    while (el && el !== document.body && el !== document.documentElement) {
      var cs = getComputedStyle(el);
      if (cs.position === 'fixed') {
        var r = el.getBoundingClientRect();
        if (r.width >= vw * 0.9 && r.height >= vh * 0.9) {
          if (!prev || SKIP.test(nm(el))) return null;
          var ok = NAME.test(nm(el)) || el.getAttribute('role') === 'dialog' ||
            el.getAttribute('aria-modal') === 'true' ||
            (alpha(cs.backgroundColor) > 0 && alpha(cs.backgroundColor) < 1);
          if (!ok) return null;
          var pr = prev.getBoundingClientRect();
          if (pr.width >= r.width * 0.98 && pr.height >= r.height * 0.98) return null;
          return prev;
        }
        return NAME.test(nm(el)) && !SKIP.test(nm(el)) ? el : null;
      }
      prev = el;
      el = el.parentElement;
    }
    return null;
  }

  function isHandle(p, cx, cy, t) {
    if (t.closest(INTER)) return false;
    var r = p.getBoundingClientRect(), y = cy - r.top;
    if (cx < r.left || cx > r.right || y < 0 || y > r.height) return false;
    if (y <= 64) return true;
    return y <= 120 && !!t.closest('h1,h2,h3,h4,h5,header');
  }

  function tr(p) {
    var m = /(-?[\d.]+)px\s+(-?[\d.]+)px/.exec(p.style.translate || '');
    return m ? [parseFloat(m[1]), parseFloat(m[2])] : [0, 0];
  }

  function start(cx, cy, t) {
    var p = findPanel(t);
    if (!p || !isHandle(p, cx, cy, t)) return null;
    var o = tr(p);
    return { p: p, sx: cx, sy: cy, ox: o[0], oy: o[1], r: p.getBoundingClientRect(), moved: false };
  }

  function move(cx, cy) {
    var d = drag, dx = cx - d.sx, dy = cy - d.sy;
    if (!d.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    if (!d.moved) {
      d.moved = true;
      document.documentElement.classList.add('pd-drag');
      if (moved.indexOf(d.p) < 0) moved.push(d.p);
    }
    dx = Math.max(40 - d.r.right, Math.min(innerWidth - 40 - d.r.left, dx));
    dy = Math.max(-d.r.top, Math.min(innerHeight - 40 - d.r.top, dy));
    d.p.style.translate = (d.ox + dx) + 'px ' + (d.oy + dy) + 'px';
  }

  function end() {
    if (!drag) return;
    if (drag.moved) lastDrag = Date.now();
    drag = null;
    document.documentElement.classList.remove('pd-drag');
  }

  window.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    var d = start(e.clientX, e.clientY, e.target);
    if (d) { drag = d; e.preventDefault(); }
  }, true);
  window.addEventListener('mousemove', function (e) {
    if (drag) { move(e.clientX, e.clientY); return; }
    var n = Date.now();
    if (n - lastMove < 80) return;
    lastMove = n;
    var p = findPanel(e.target);
    document.documentElement.classList.toggle('pd-can', !!(p && isHandle(p, e.clientX, e.clientY, e.target)));
  }, true);
  window.addEventListener('mouseup', end, true);
  window.addEventListener('click', function (e) {
    if (lastDrag && Date.now() - lastDrag < 350) { lastDrag = 0; e.stopPropagation(); e.preventDefault(); }
  }, true);

  window.addEventListener('touchstart', function (e) {
    if (e.touches.length !== 1) return;
    var t = e.touches[0], d = start(t.clientX, t.clientY, e.target);
    if (d) { drag = d; e.preventDefault(); }
  }, { capture: true, passive: false });
  window.addEventListener('touchmove', function (e) {
    if (!drag) return;
    e.preventDefault();
    move(e.touches[0].clientX, e.touches[0].clientY);
  }, { capture: true, passive: false });
  window.addEventListener('touchend', end, true);
  window.addEventListener('touchcancel', end, true);

  /* 팝업이 닫히면 위치 초기화 */
  new MutationObserver(function () {
    if (!moved.length) return;
    moved = moved.filter(function (p) {
      if (p.getClientRects().length) return true;
      p.style.translate = '';
      return false;
    });
  }).observe(document.documentElement, {
    attributes: true, subtree: true, childList: true,
    attributeFilter: ['class', 'style', 'open', 'hidden']
  });
})();
</script>
</body>
</html>
