<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADMIN PORTAL 관리</title>
<style>
  :root { --bg:#f4f6fa; --card:#ffffff; --ink:#1f2937; --sub:#6b7280; --line:#d9dee7; --accent:#1d4ed8; --danger:#c62828; --ok:#15803d; --adm:#c2410c; --adm-bg:#fff1e6; --adm-line:#f0a36b; --adm-ink:#9a3412; --view:#1d4ed8; --view-bg:#e8f0ff; --view-line:#8fb0f5; --view-ink:#1e3a8a; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo",sans-serif; font-size:15px; line-height:1.5; }
  .wrap { max-width:860px; margin:0 auto; padding:20px 16px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:24px; letter-spacing:1px; }
  .bar { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  button, .btn { font:inherit; font-size:14px; line-height:1.3; padding:2px 6px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); cursor:pointer; text-decoration:none; }
  button:hover, .btn:hover { border-color:var(--accent); color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  button.primary:hover { color:#fff; opacity:.9; }
  button.danger { color:var(--danger); }
  button.danger:hover { border-color:var(--danger); color:var(--danger); }
  #status { font-size:13px; min-height:20px; margin-bottom:8px; }
  #status.ok { color:var(--ok); } #status.err { color:var(--danger); } #status.dirty { color:#b45309; }
  .cat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-bottom:12px; }
  .cat-head { display:flex; gap:6px; margin-bottom:8px; }
  .cat-head input { flex:1; font-weight:700; font-size:16px; }
  input { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--ink); min-width:0; }
  input:focus { outline:2px solid #bfd0fb; border-color:var(--accent); }
  .row { display:flex; gap:6px; margin-bottom:6px; }
  .row .nm { flex:0 0 190px; } .row .ur { flex:1; }
  .tg { display:flex; gap:4px; align-items:center; flex:none; }
  .tp { position:relative; cursor:pointer; padding:2px 6px; border:1px solid var(--line); border-radius:6px; font-size:14px; line-height:1.3; color:var(--sub); background:#fff; user-select:none; }
  .tp input { position:absolute; opacity:0; pointer-events:none; }
  .tp.admin.on { background:var(--adm); border-color:var(--adm); color:#fff; font-weight:700; }
  .tp.view.on { background:var(--view); border-color:var(--view); color:#fff; font-weight:700; }
  .tp.admin:not(.on):hover { border-color:var(--adm); color:var(--adm-ink); background:var(--adm-bg); }
  .tp.view:not(.on):hover { border-color:var(--view); color:var(--view-ink); background:var(--view-bg); }
  .tp:focus-within { outline:2px solid #bfd0fb; }
  .mv { display:flex; gap:2px; align-items:center; flex:none; }
  .handle { cursor:grab; user-select:none; padding:2px 6px; border:1px solid var(--line); border-radius:6px; background:#fff; color:var(--sub); font-size:14px; line-height:1.3; }
  .handle:hover { border-color:var(--accent); color:var(--accent); }
  .handle:active { cursor:grabbing; }
  button:disabled { opacity:.35; cursor:default; }
  button:disabled:hover { border-color:var(--line); color:var(--ink); }
  .row.dragging { opacity:.4; }
  .row.over-top { box-shadow:0 -2px 0 0 var(--accent); }
  .row.over-bottom { box-shadow:0 2px 0 0 var(--accent); }
  details.cfg { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:8px 12px; margin-top:16px; }
  details.cfg summary { cursor:pointer; font-weight:700; }
  .cfg-grid { display:grid; grid-template-columns:110px 1fr; gap:6px 8px; margin-top:8px; align-items:center; }
  .hint { font-size:12px; color:var(--sub); margin-top:6px; }
  @media (max-width:600px) { .row { flex-wrap:wrap; } .row .nm { flex:1 1 100%; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>ADMIN PORTAL 관리</h1>
    <div class="bar">
      <a class="btn" href="portal.html">보기 페이지</a>
      <button id="addCat">+ 대분류 추가</button>
      <button id="saveBtn" class="primary">저장</button>
    </div>
  </header>
  <div id="status"></div>
  <div id="root"></div>

  <details class="cfg">
    <summary>저장 설정 (GitHub)</summary>
    <div class="cfg-grid">
      <label for="cOwner">Owner</label><input id="cOwner">
      <label for="cRepo">Repository</label><input id="cRepo">
      <label for="cPath">파일 경로</label><input id="cPath">
      <label for="cBranch">Branch</label><input id="cBranch">
      <label for="cToken">Token</label><input id="cToken" type="password" autocomplete="off" placeholder="GitHub Personal Access Token (Contents: Read and write)">
    </div>
    <div class="bar" style="margin-top:8px">
      <button id="saveCfg">설정 저장</button>
      <button id="dlBtn">links.json 내려받기</button>
    </div>
    <p class="hint">설정과 토큰은 이 브라우저(localStorage)에만 저장됩니다. 토큰이 없으면 저장 버튼 대신 links.json을 내려받아 저장소에 직접 올리면 됩니다.</p>
  </details>
</div>
<script>
(function () {
  var DEF = { owner:'yangji-madang', repo:'portal', path:'links.json', branch:'main', token:'' };
  var data = { categories: [] };
  var dirty = false;
  var $ = function (id) { return document.getElementById(id); };
  var rootEl = $('root'), statusEl = $('status');

  function uid() { return 'x' + Math.random().toString(36).slice(2, 9); }
  function setStatus(msg, cls) { statusEl.textContent = msg || ''; statusEl.className = cls || ''; }
  function markDirty() { dirty = true; setStatus('저장되지 않은 변경 사항이 있습니다.', 'dirty'); }
  function getCfg() {
    try { return Object.assign({}, DEF, JSON.parse(localStorage.getItem('portalCfg') || '{}')); }
    catch (e) { return Object.assign({}, DEF); }
  }
  function el(tag, props) {
    var n = document.createElement(tag);
    if (props) Object.keys(props).forEach(function (k) { n[k] = props[k]; });
    return n;
  }

  var dragSrc = null, focusKey = null;

  function moveLink(c, from, to) {
    if (to < 0 || to >= c.links.length || from === to) return;
    var item = c.links.splice(from, 1)[0];
    c.links.splice(to, 0, item);
    markDirty(); render();
  }
  function clearDragMarks() {
    Array.prototype.forEach.call(document.querySelectorAll('.dragging,.over-top,.over-bottom'), function (n) {
      n.classList.remove('dragging', 'over-top', 'over-bottom');
    });
  }

  function render() {
    rootEl.innerHTML = '';
    data.categories.forEach(function (c, ci) {
      var box = el('section', { className: 'cat' });
      var head = el('div', { className: 'cat-head' });
      var name = el('input', { value: c.name, placeholder: '대분류명' });
      name.oninput = function () { c.name = name.value; markDirty(); };
      var delC = el('button', { className: 'danger', textContent: '대분류 삭제' });
      delC.onclick = function () {
        if (confirm('"' + c.name + '" 대분류와 하위 링크를 모두 삭제할까요?')) {
          data.categories.splice(ci, 1); markDirty(); render();
        }
      };
      head.appendChild(name); head.appendChild(delC);
      box.appendChild(head);

      c.links.forEach(function (l, li) {
        var row = el('div', { className: 'row' });

        var mv = el('div', { className: 'mv' });
        var handle = el('span', { className: 'handle', textContent: '⠿', title: '드래그하여 순서 변경' });
        handle.onmousedown = function () { row.draggable = true; };
        handle.onmouseup = function () { row.draggable = false; };
        var up = el('button', { textContent: '▲', title: '위로 이동', disabled: li === 0 });
        up.setAttribute('data-k', l.id + ':up');
        up.onclick = function () { focusKey = l.id + ':up'; moveLink(c, li, li - 1); };
        var dn = el('button', { textContent: '▼', title: '아래로 이동', disabled: li === c.links.length - 1 });
        dn.setAttribute('data-k', l.id + ':dn');
        dn.onclick = function () { focusKey = l.id + ':dn'; moveLink(c, li, li + 1); };
        mv.appendChild(handle); mv.appendChild(up); mv.appendChild(dn);

        row.ondragstart = function (e) {
          dragSrc = { ci: ci, li: li };
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', String(li));
        };
        row.ondragover = function (e) {
          if (!dragSrc || dragSrc.ci !== ci) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          var r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
          row.classList.toggle('over-bottom', after);
          row.classList.toggle('over-top', !after);
        };
        row.ondragleave = function () { row.classList.remove('over-top', 'over-bottom'); };
        row.ondrop = function (e) {
          if (!dragSrc || dragSrc.ci !== ci) return;
          e.preventDefault();
          var r = row.getBoundingClientRect(), after = e.clientY > r.top + r.height / 2;
          var from = dragSrc.li, to = li + (after ? 1 : 0);
          if (from < to) to--;
          dragSrc = null; clearDragMarks();
          moveLink(c, from, to);
        };
        row.ondragend = function () { dragSrc = null; row.draggable = false; clearDragMarks(); };

        var nm = el('input', { className: 'nm', value: l.name, placeholder: '링크명' });
        nm.oninput = function () { l.name = nm.value; markDirty(); };
        var tg = el('div', { className: 'tg' });
        [['admin', '관리'], ['view', '보기']].forEach(function (o) {
          var lb = el('label', { className: 'tp ' + o[0] + (l.type === o[0] ? ' on' : '') });
          var rb = el('input', { type: 'radio', name: 't_' + l.id, checked: l.type === o[0] });
          rb.onchange = function () { l.type = o[0]; markDirty(); render(); };
          lb.appendChild(rb); lb.appendChild(document.createTextNode(o[1])); tg.appendChild(lb);
        });
        var ur = el('input', { className: 'ur', value: l.url, placeholder: 'https://' });
        ur.oninput = function () { l.url = ur.value; markDirty(); };
        var d = el('button', { className: 'danger', textContent: '삭제' });
        d.onclick = function () {
          if (confirm('"' + l.name + '" 링크를 삭제할까요?')) { c.links.splice(li, 1); markDirty(); render(); }
        };
        row.appendChild(mv); row.appendChild(nm); row.appendChild(tg); row.appendChild(ur); row.appendChild(d);
        box.appendChild(row);
      });

      var add = el('button', { textContent: '+ 링크 추가' });
      add.onclick = function () { c.links.push({ id: uid(), name: '', url: '', type: 'view' }); markDirty(); render(); };
      box.appendChild(add);
      rootEl.appendChild(box);
    });
    if (!data.categories.length) rootEl.appendChild(el('p', { textContent: '대분류가 없습니다. 상단의 "+ 대분류 추가"를 눌러주세요.' }));
    if (focusKey) {
      var f = rootEl.querySelector('[data-k="' + focusKey + '"]');
      if (f && !f.disabled) f.focus();
      focusKey = null;
    }
  }

  function validate() {
    for (var i = 0; i < data.categories.length; i++) {
      var c = data.categories[i];
      if (!c.name.trim()) return '대분류명이 비어 있습니다.';
      for (var j = 0; j < c.links.length; j++) {
        var l = c.links[j];
        if (!l.name.trim()) return '"' + c.name + '"의 링크명이 비어 있습니다.';
        if (!/^https?:\/\//i.test(l.url.trim())) return '"' + l.name + '"의 URL은 http:// 또는 https://로 시작해야 합니다.';
      }
    }
    return '';
  }
  function cleaned() {
    return {
      categories: data.categories.map(function (c) {
        return { id: c.id, name: c.name.trim(), links: c.links.map(function (l) { return { id: l.id, name: l.name.trim(), url: l.url.trim(), type: l.type === 'admin' ? 'admin' : 'view' }; }) };
      })
    };
  }
  function toB64(str) {
    var bytes = new TextEncoder().encode(str), bin = '';
    bytes.forEach(function (b) { bin += String.fromCharCode(b); });
    return btoa(bin);
  }

  async function save() {
    var err = validate();
    if (err) { setStatus(err, 'err'); return; }
    var cfg = getCfg();
    if (!cfg.token) { setStatus('토큰이 없습니다. 하단 "저장 설정"에 입력하거나 links.json을 내려받아 주세요.', 'err'); return; }
    setStatus('저장 중...', '');
    var api = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path;
    var headers = { 'Authorization': 'Bearer ' + cfg.token, 'Accept': 'application/vnd.github+json' };
    try {
      var sha;
      var g = await fetch(api + '?ref=' + encodeURIComponent(cfg.branch), { headers: headers });
      if (g.ok) sha = (await g.json()).sha;
      else if (g.status !== 404) throw new Error('조회 실패 (' + g.status + ')');
      var body = { message: 'Update ADMIN PORTAL links', content: toB64(JSON.stringify(cleaned(), null, 2) + '\n'), branch: cfg.branch };
      if (sha) body.sha = sha;
      var p = await fetch(api, { method: 'PUT', headers: Object.assign({ 'Content-Type': 'application/json' }, headers), body: JSON.stringify(body) });
      if (!p.ok) throw new Error('저장 실패 (' + p.status + ')');
      dirty = false;
      setStatus('저장되었습니다. 보기 페이지에 바로 반영됩니다.', 'ok');
    } catch (e) { setStatus('오류: ' + e.message, 'err'); }
  }

  function download() {
    var a = el('a', { href: URL.createObjectURL(new Blob([JSON.stringify(cleaned(), null, 2) + '\n'], { type: 'application/json' })), download: 'links.json' });
    document.body.appendChild(a); a.click(); a.remove();
  }

  function loadCfgUI() {
    var c = getCfg();
    $('cOwner').value = c.owner; $('cRepo').value = c.repo; $('cPath').value = c.path; $('cBranch').value = c.branch; $('cToken').value = c.token;
  }

  $('addCat').onclick = function () { data.categories.push({ id: uid(), name: '', links: [] }); markDirty(); render(); };
  $('saveBtn').onclick = save;
  $('dlBtn').onclick = download;
  $('saveCfg').onclick = function () {
    localStorage.setItem('portalCfg', JSON.stringify({
      owner: $('cOwner').value.trim(), repo: $('cRepo').value.trim(), path: $('cPath').value.trim(),
      branch: $('cBranch').value.trim(), token: $('cToken').value.trim()
    }));
    setStatus('설정이 저장되었습니다.', 'ok');
  };
  window.addEventListener('beforeunload', function (e) { if (dirty) { e.preventDefault(); e.returnValue = ''; } });

  loadCfgUI();
  (function () {
    var cfg = getCfg();
    var h = { 'Accept': 'application/vnd.github.raw+json' };
    if (cfg.token) h['Authorization'] = 'Bearer ' + cfg.token;
    var api = 'https://api.github.com/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + cfg.path + '?ref=' + encodeURIComponent(cfg.branch);
    function getJson(u, hh) {
      return fetch(u, { headers: hh || {}, cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
    }
    getJson(api, h)
      .catch(function () { return getJson('links.json?t=' + Date.now()); })
      .then(function (j) { j.categories.forEach(function (c) { c.links.forEach(function (l) { if (l.type !== 'admin') l.type = 'view'; }); }); data = j; render(); })
      .catch(function () { setStatus('links.json을 불러오지 못했습니다. 새로 등록해 주세요.', 'err'); render(); });
  })();
})();
</script>
</body>
</html>
